          
name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: List schemes
        run: xcodebuild -list -project MyIOSApp.xcodeproj

      - name: Build app
        id: build_app
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project MyIOSApp.xcodeproj \
            -scheme MyIOSApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Build-Log
          path: build.log
          if-no-files-found: ignore

      - name: Stop if build failed
        if: steps.build_app.outcome == 'failure'
        run: exit 1

      - name: Package IPA
        if: success()
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MyIOSApp.app Payload/
          zip -r MyIOSApp.ipa Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyIOSApp-unsigned-IPA
          path: MyIOSApp.ipa
