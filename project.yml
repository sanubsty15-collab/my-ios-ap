
name: MyIOSApp

options:
  bundleIdPrefix: com.sanu
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  MyIOSApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    resources:
      - path: index.html
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sanu.myiosapp
        PRODUCT_NAME: "My iOS App"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    scheme:
      gatherCoverageData: false
